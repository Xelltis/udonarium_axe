name: ✨ 機能リクエスト
description: 新機能・改善の提案
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。背景にある「なぜ」が伝わると検討を進めやすくなります。

  - type: checkboxes
    id: preflight
    attributes:
      label: 確認事項
      options:
        - label: 既存のIssueに同じ提案がないか検索した
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: どんな場面で困っているか、現状の不便さを説明してください。
      placeholder: 〜のとき、〜ができなくて困っている。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する機能・改善
      description: どうなると嬉しいかを具体的に書いてください。
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 影響範囲
      description: 関係する機能・領域を選択してください（Conventional Commitsのscopeに対応）。
      multiple: true
      options:
        - chat
        - tabletop
        - character
        - card
        - dice
        - lobby
        - media
        - controller
        - vote
        - inventory
        - alarm
        - network
        - storage
        - sync
        - css
        - その他 / 不明
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・検討したこと
      description: 他に考えた方法や、既存機能での回避策があれば記載してください。
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: 参考画像、他ツールの事例、関連Issueなどがあれば添付してください。
    validations:
      required: false
