version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The workflows and this environment run on Node 24, so the types' major is chosen by hand, not followed.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # 10 expects a conventional-changelog-writer newer than the one @semantic-release/release-notes-generator
      # 14 uses, and together they make release notes and a CHANGELOG of headings alone. Held until
      # release-notes-generator catches up.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major
      # Angular names the TypeScript it takes by minor (22 takes >=6.0 <6.1). Held until Angular takes it.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # Angular's framework, compiler and build tools ask for one another at the same version, so they go up
      # in one PR across dependencies and dev dependencies. Split into the groups by kind, neither PR resolves
      # npm ci on its own (as #139 and #144 did not). They are kept out of the two groups below.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-*'
          - 'ng-*'
          - '@ng-*'
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
        exclude-patterns:
          - '@angular/*'
          - '@angular-*'
          - 'ng-*'
          - '@ng-*'
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - '@angular/*'
          - '@angular-*'
          - 'ng-*'
          - '@ng-*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
