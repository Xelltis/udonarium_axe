version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # ワークフローとこの環境はNode 24で動いているので、型のメジャーは最新を追わずに手で決める。
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # 10は@semantic-release/release-notes-generator 14が使うconventional-changelog-writerより新しい
      # 版を前提にしていて、組み合わせるとリリースノートとCHANGELOGが見出しだけの空になる。
      # release-notes-generatorが追いつくまで止める。
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major
      # AngularはTypeScriptの対応範囲をマイナー単位で決めている（22は>=6.0 <6.1）。Angularが受けるまで止める。
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # Angularのフレームワーク・コンパイラ・ビルドツールは互いを同じ版で求めるので、本番依存と開発依存に
      # またがっていても1つのPRで上げる。種類別のグループに割ると、どちらのPRも単独ではnpm ciが解決しない
      # （#139と#144がそうだった）。下の2つのグループからは外しておく。
      angular:
        patterns:
          - '@angular/*'
          - '@angular-*'
          - 'ng-*'
          - '@ng-*'
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
        exclude-patterns:
          - '@angular/*'
          - '@angular-*'
          - 'ng-*'
          - '@ng-*'
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - '@angular/*'
          - '@angular-*'
          - 'ng-*'
          - '@ng-*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
