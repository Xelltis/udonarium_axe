name: Deploy

# A reusable workflow that syncs to S3 and invalidates CloudFront for one environment
# (production / public / production-vercel), called from release.yml through workflow_call.
#
# The `environment` input names a GitHub Environment, and the secrets are resolved from that
# environment alone. Each environment holds these five secrets.
#   - AWS_REGION
#   - AWS_S3_BUCKET
#   - AWS_DEPLOY_ROLE_ARN
#   - CLOUDFRONT_DISTRIBUTION_ID
#   - BACKEND_URL

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment name (production | public | production-vercel)'
        required: true
        type: string
      ref:
        description: 'デプロイ対象のGit ref（タグ推奨: v1.2.3）'
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inject the backend URL and transport
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          TRANSPORT: ${{ vars.TRANSPORT }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::BACKEND_URL secret is not configured for environment '${{ inputs.environment }}'"
            exit 1
          fi
          TRANSPORT="${TRANSPORT:-skyway}"
          if [ "$TRANSPORT" != "skyway" ] && [ "$TRANSPORT" != "server" ]; then
            echo "::error::TRANSPORT variable must be 'skyway' or 'server', not '$TRANSPORT'"
            exit 1
          fi
          mkdir -p dist/assets
          jq --arg url "$BACKEND_URL" --arg transport "$TRANSPORT" '.backend.url = $url | .transport = $transport' \
            src/assets/config.json.example > dist/assets/config.json
          test -s dist/assets/config.json

      - name: Configure AWS credentials (OIDC AssumeRole)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: udonarium-axe-${{ inputs.environment }}-${{ github.run_id }}

      - name: Sync dist/ to S3
        env:
          BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          # axe_*.zip is for the GitHub release, so it is kept off S3
          aws s3 sync dist/ "s3://$BUCKET/" \
            --delete \
            --exclude "axe_*.zip" \
            --cache-control "public, max-age=31536000, immutable"

          # Files without a hash in their names are revalidated, to take effect at once
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp dist/assets/config.json "s3://$BUCKET/assets/config.json" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "application/json"
          # The translation files have no hash either and are replaced under the same names, so revalidate
          aws s3 cp dist/assets/i18n/ "s3://$BUCKET/assets/i18n/" \
            --recursive \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "application/json"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
