commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: 'src/**/*.{ts,html}'
      run: npx eslint {staged_files}

    - name: test
      glob:
        - 'src/**/*.{ts,html,css}'
        - 'vitest.config.ts'
        - 'vitest-base.config.ts'
        - 'tsconfig.spec.json'
      run: node scripts/vitest-related.mjs {staged_files}

pre-push:
  jobs:
    - name: test
      run: npx vitest run

    - name: build
      run: npm run build
