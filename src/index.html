<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Udonarium Axe</title>
    <base href="./" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f3eef8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f2a38" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Udonarium Axe" />
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
    <script>
      (function () {
        var langs = ['ja', 'en', 'ko'];
        var stored = null;
        try {
          stored = localStorage.getItem('ui-lang');
        } catch (e) {}
        var nav = (navigator.language || '').toLowerCase();
        var lang =
          langs.indexOf(stored) >= 0 ? stored : nav.indexOf('ja') === 0 ? 'ja' : nav.indexOf('ko') === 0 ? 'ko' : 'en';
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
        link.href = 'assets/i18n/' + lang + '.json';
        document.head.appendChild(link);
      })();
    </script>
    <!-- テーマフラッシュ防止: Angular起動前に data-theme を適用 -->
    <script>
      (function () {
        var t = localStorage.getItem('ui-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        // 配信に重ねる画面は、読み込み中の表示から既に透けている必要がある。
        if (/^#join\?/.test(location.hash) && /[?&]overlay=1(&|$)/.test(location.hash))
          document.documentElement.setAttribute('data-overlay', '1');
      })();
    </script>
  </head>

  <body>
    <app-root>
      <div class="sk-cube-grid">
        <div class="sk-cube sk-cube1"></div>
        <div class="sk-cube sk-cube2"></div>
        <div class="sk-cube sk-cube3"></div>
        <div class="sk-cube sk-cube4"></div>
        <div class="sk-cube sk-cube5"></div>
        <div class="sk-cube sk-cube6"></div>
        <div class="sk-cube sk-cube7"></div>
        <div class="sk-cube sk-cube8"></div>
        <div class="sk-cube sk-cube9"></div>
        <div class="sk-title">Now Loading.</div>
      </div>
    </app-root>
  </body>
</html>
