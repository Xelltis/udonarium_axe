<div class="box-border flex flex-col gap-3 p-3">
  <div
    class="rounded-ui-sm bg-ui-input relative mx-auto overflow-hidden"
    [style.width.px]="stage"
    [style.height.px]="stage"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
    (wheel)="onWheel($event)"
  >
    @if (objectUrl) {
      <img
        class="absolute top-0 left-0 max-w-none origin-top-left touch-none select-none"
        [src]="objectUrl"
        [style.transform]="'translate(' + tx() + 'px,' + ty() + 'px) scale(' + scale() + ')'"
        alt=""
        draggable="false"
      />
    }
    <div
      class="rounded-ui-sm ring-ui-accent pointer-events-none absolute top-1/2 left-1/2 -translate-1/2 shadow-[0_0_0_9999px_rgba(0,0,0,0.6)] ring-2"
      [style.width.px]="frame"
      [style.height.px]="frame"
    ></div>
  </div>
  <div class="flex justify-end gap-2">
    <button
      type="button"
      class="rounded-ui-sm border-ui-border-panel bg-ui-panel text-ui-text hover:border-ui-accent hover:bg-ui-hover hover:text-ui-accent m-0 inline-flex shrink-0 cursor-pointer items-center gap-1.25 border border-solid px-2.5 py-1.25 text-[12px] transition-[background,border-color] hover:shadow-none"
      (click)="cancel()"
    >
      {{ 'common.button.cancel' | transloco }}
    </button>
    <button
      type="button"
      class="rounded-ui-sm bg-ui-accent-solid hover:bg-ui-accent-solid m-0 inline-flex shrink-0 cursor-pointer items-center gap-1.25 border-none px-2.5 py-1.25 text-[12px] font-medium text-white transition-[opacity,background] hover:border-transparent hover:text-white hover:opacity-85 hover:shadow-none"
      (click)="apply()"
    >
      {{ 'feature.mapEditor.props.textureCropApply' | transloco }}
    </button>
  </div>
</div>
