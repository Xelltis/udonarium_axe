@for (placed of beamsOnScreen(); track $index) {
  @for (fin of placed.fins; track $index) {
    <div [style.background]="placed.background | safe: 'style'" [ngStyle]="fin"></div>
  }
}
@for (placed of glowsOnScreen(); track $index) {
  <div [style.background]="placed.background | safe: 'style'" [ngStyle]="placed.style"></div>
}
