@if (target) {
  <div class="text-ui-text flex h-full flex-col gap-3 overflow-y-auto p-3 text-[13px]">
    <div class="border-ui-accent border-l-2 border-solid pl-2">
      <span class="text-[12px] font-semibold tracking-wide">{{ 'feature.ambience.settingsTitle' | transloco }}</span>
    </div>

    <div class="grid grid-cols-[6rem_1fr_2.5rem] items-center gap-x-3 gap-y-2">
      <label class="text-ui-muted text-[11px]">{{ 'feature.ambience.nameLabel' | transloco }}</label>
      <input
        type="text"
        class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text col-span-2 box-border w-full border border-solid px-2 py-1 text-[13px]"
        [(ngModel)]="name"
        name="ambienceName"
      />

      <label class="text-ui-muted text-[11px]">{{ 'feature.ambience.kindLabel' | transloco }}</label>
      <select
        class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text col-span-2 box-border w-full border border-solid px-2 py-1 text-[13px]"
        [(ngModel)]="kind"
        name="ambienceKind"
      >
        @for (k of kinds; track k) {
          <option [value]="k">{{ kindLabel(k) }}</option>
        }
      </select>

      <label class="text-ui-muted text-[11px]">{{ 'feature.ambience.densityLabel' | transloco }}</label>
      <input
        type="range"
        min="0"
        max="100"
        class="w-full cursor-pointer [accent-color:var(--ui-accent)]"
        [(ngModel)]="densityPercent"
        name="ambienceDensity"
      />
      <span class="text-ui-muted text-right text-[11px]">{{ densityPercent }}%</span>

      @if (kind === 'water') {
        <label class="text-ui-muted text-[11px]">{{ 'feature.ambience.waterPresetLabel' | transloco }}</label>
        <select
          class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text col-span-2 box-border w-full border border-solid px-2 py-1 text-[13px]"
          [(ngModel)]="waterPreset"
          name="ambienceWaterPreset"
        >
          <option [ngValue]="null" disabled>{{ 'feature.ambience.waterPresetCustom' | transloco }}</option>
          @for (preset of waterPresets; track preset) {
            <option [ngValue]="preset">{{ waterPresetLabel(preset) }}</option>
          }
        </select>

        <label class="text-ui-muted text-[11px]">{{ 'feature.ambience.surfaceLabel' | transloco }}</label>
        <input
          type="number"
          min="0"
          step="0.1"
          [max]="maxSurfaceCells"
          class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text col-span-2 box-border w-full border border-solid px-2 py-1 text-[13px]"
          [(ngModel)]="surfaceCells"
          name="ambienceSurface"
        />

        <label class="text-ui-muted text-[11px]">{{ 'feature.ambience.turbidityLabel' | transloco }}</label>
        <input
          type="range"
          min="0"
          max="100"
          class="w-full cursor-pointer [accent-color:var(--ui-accent)]"
          [(ngModel)]="turbidityPercent"
          name="ambienceTurbidity"
        />
        <span class="text-ui-muted text-right text-[11px]">{{ turbidityPercent }}%</span>

        <label class="text-ui-muted text-[11px]">{{ 'feature.ambience.dirtLabel' | transloco }}</label>
        <input
          type="range"
          min="0"
          max="100"
          class="w-full cursor-pointer [accent-color:var(--ui-accent)]"
          [(ngModel)]="dirtPercent"
          name="ambienceDirt"
        />
        <span class="text-ui-muted text-right text-[11px]">{{ dirtPercent }}%</span>

        <label class="text-ui-muted text-[11px]">{{ 'feature.ambience.leavesLabel' | transloco }}</label>
        <input
          type="range"
          min="0"
          max="100"
          class="w-full cursor-pointer [accent-color:var(--ui-accent)]"
          [(ngModel)]="leavesPercent"
          name="ambienceLeaves"
        />
        <span class="text-ui-muted text-right text-[11px]">{{ leavesPercent }}%</span>

        <label class="text-ui-muted text-[11px]">{{ 'feature.ambience.flowSpeedLabel' | transloco }}</label>
        <input
          type="range"
          min="0"
          max="100"
          class="w-full cursor-pointer [accent-color:var(--ui-accent)]"
          [(ngModel)]="flowSpeedPercent"
          name="ambienceFlowSpeed"
        />
        <span class="text-ui-muted text-right text-[11px]">{{ flowSpeedPercent }}%</span>

        <label class="text-ui-muted text-[11px]">{{ 'feature.ambience.flowDirectionLabel' | transloco }}</label>
        <select
          class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text col-span-2 box-border w-full border border-solid px-2 py-1 text-[13px] disabled:opacity-40"
          [(ngModel)]="flowDirection"
          [disabled]="flowSpeedPercent === 0"
          name="ambienceFlowDirection"
        >
          @for (direction of flowDirections; track direction) {
            <option [ngValue]="direction">{{ flowDirectionLabel(direction) }}</option>
          }
        </select>
      }

      <label class="text-ui-muted text-[11px]">{{ 'feature.ambience.colorLabel' | transloco }}</label>
      <input
        type="color"
        class="rounded-ui-sm border-ui-border-panel h-6.5 w-12 cursor-pointer border border-solid bg-transparent px-0.5 py-px"
        [(ngModel)]="color"
        name="ambienceColor"
      />
      <button
        type="button"
        class="rounded-ui-sm border-ui-border-panel text-ui-muted hover:text-ui-text cursor-pointer border border-solid px-1 py-0.5 text-[10px] disabled:cursor-not-allowed disabled:opacity-40"
        [disabled]="isDefaultColor"
        (click)="resetColor()"
      >
        {{ 'feature.ambience.resetColor' | transloco }}
      </button>

      <label class="text-ui-muted text-[11px]">{{ 'feature.ambience.shownToLabel' | transloco }}</label>
      <select
        class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text col-span-2 box-border w-full border border-solid px-2 py-1 text-[13px]"
        [(ngModel)]="shownTo"
        name="ambienceShownTo"
      >
        @for (shown of shownToChoices; track shown) {
          <option [ngValue]="shown">{{ shownToLabel(shown) }}</option>
        }
      </select>

      <label class="text-ui-muted text-[11px]">{{ 'feature.ambience.brightnessLabel' | transloco }}</label>
      <select
        class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text col-span-2 box-border w-full border border-solid px-2 py-1 text-[13px]"
        [(ngModel)]="brightness"
        name="ambienceBrightness"
      >
        @for (shade of brightnessChoices; track shade) {
          <option [ngValue]="shade">{{ brightnessLabel(shade) }}</option>
        }
      </select>

      <label class="text-ui-muted text-[11px]">{{ 'feature.ambience.widthLabel' | transloco }}</label>
      <input
        type="number"
        min="1"
        max="100"
        class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text col-span-2 box-border w-full border border-solid px-2 py-1 text-[13px]"
        [(ngModel)]="width"
        name="ambienceWidth"
      />

      <label class="text-ui-muted text-[11px]">{{ 'feature.ambience.heightLabel' | transloco }}</label>
      <input
        type="number"
        min="1"
        max="100"
        class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text col-span-2 box-border w-full border border-solid px-2 py-1 text-[13px]"
        [(ngModel)]="height"
        name="ambienceHeight"
      />
    </div>

    <label class="flex cursor-pointer items-center gap-1.5 select-none">
      <input
        type="checkbox"
        class="size-3.5 cursor-pointer [accent-color:var(--ui-accent)]"
        [(ngModel)]="blocksSight"
        name="ambienceBlocksSight"
      />
      {{ 'feature.ambience.blocksSightLabel' | transloco }}
    </label>

    <label class="flex cursor-pointer items-center gap-1.5 select-none">
      <input
        type="checkbox"
        class="size-3.5 cursor-pointer [accent-color:var(--ui-accent)]"
        [(ngModel)]="isLock"
        name="ambienceLock"
      />
      {{ 'feature.ambience.lockLabel' | transloco }}
    </label>
  </div>
}
