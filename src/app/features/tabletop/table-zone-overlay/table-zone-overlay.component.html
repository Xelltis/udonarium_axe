@if (model().zones.length > 0) {
  <ul hidden data-testid="zone-overlay">
    @for (zone of model().zones; track zone.id) {
      <li
        data-testid="zone-mark"
        [attr.data-zone]="zone.id"
        [attr.data-overflowing]="zone.overflowing ? '' : null"
        [attr.data-forming]="zone.forming ? '' : null"
        [attr.data-x]="zone.cx"
        [attr.data-y]="zone.cy"
        [attr.data-reach]="zone.reach"
      >
        {{ zone.label }}
      </li>
    }
    @for (mark of model().inside; track mark.id) {
      <li data-testid="zone-inside-mark" [attr.data-x]="mark.x" [attr.data-y]="mark.y"></li>
    }
  </ul>
}
