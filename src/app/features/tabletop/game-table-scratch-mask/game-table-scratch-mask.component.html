<div
  class="is-3d absolute cursor-grab"
  appMovable
  [movable.option]="movableOption()"
  [movable.disable]="isLock()"
  (movable.ondragstart)="onMove()"
  (movable.ondragend)="onMoved()"
  (contextmenu)="onContextMenu($event)"
  [style.width.px]="width() * gridSize"
  [style.height.px]="height() * gridSize"
  [style.transform]="'translateX(' + posX() + 'px) translateY(' + posY() + 'px) translateZ(' + posZ() + 'px)'"
>
  <div class="is-fit-full" [style.background-color]="color()" [style.opacity]="0.6"></div>
</div>
