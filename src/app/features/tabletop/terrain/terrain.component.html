<!--
  The block is a box on the screen round where the table's canvas draws it, with its top laid there
  to be pointed at, the frame that turns it lying round its foot, as a piece's ring lies round its
  pedestal, and the label of its switch over it. A
  press elsewhere on the block reaches it through picking. The top of a block locked in place lets
  the pointer through, as the block lets a press through to a piece behind it, unless it is a door
  to open or a switch to press.
-->
@let id = terrain().identifier;
<div
  class="group pointer-events-none size-full select-none [-moz-user-drag:none] [-webkit-user-drag:none]"
  data-hud-box
  appMovable
  [movable.option]="movableOption()"
  [movable.disable]="isLocked()"
  [appSelectable]="terrain()"
  (movable.ondragstart)="onMove()"
  (movable.ondragend)="onMoved()"
  (pointerdown)="notePress($event)"
  (click)="onBlockClick($event)"
  [attr.data-table-passthrough]="isLocked() ? '' : null"
  [attr.data-switch-host]="pressable() ? '' : null"
>
  <div
    class="pointer-events-none size-full"
    appRotable
    [rotable.option]="rotableOption()"
    (rotable.ondragstart)="onMove()"
    (rotable.ondragend)="onMoved()"
    [rotable.disable]="isLocked()"
  >
    <div
      data-part="top"
      [class.pointer-events-auto]="!isLocked() || (isDoor() && mayOpenDoor()) || pressable()"
      [class.cursor-grab]="!isLocked()"
      [class.cursor-pointer]="((isDoor() && mayOpenDoor()) || pressable()) && isLocked()"
      [appHudPlace]="{ owner: id, part: 'top' }"
    ></div>
    @if (!isLocked()) {
      <turn-frame [owner]="id" [stand]="turnStand()" />
    }
    @if (switchLabel(); as label) {
      <div
        class="pointer-events-none"
        data-testid="terrain-switch-label"
        [appHudPlace]="{ owner: id, part: 'top', place: 'above' }"
      >
        <span
          class="bg-ui-elevated text-ui-text rounded-ui shadow-ui-sm block border border-solid px-2 py-0.5 text-[11px]/4 whitespace-nowrap transition-opacity"
          [class.border-ui-accent]="!switchNotice()"
          [class.border-ui-danger]="!!switchNotice()"
          [class.opacity-0]="!guide.shown() && !switchNotice()"
          [class.group-hover:opacity-100]="!guide.shown() && !switchNotice()"
          >{{ switchNotice() || label }}</span
        >
      </div>
    }
  </div>
  @if (altitudeGuide(); as floating) {
    <altitude-guide [owner]="id" [guide]="floating" />
  }
</div>
