<canvas
  #floorCanvas
  class="pointer-events-none absolute top-0 left-0 origin-top-left"
  [class.invisible]="!floorTransform()"
  [style.transform]="floorTransform()"
></canvas>
@for (placed of volumesOnScreen(); track placed.identifier) {
  @for (line of placed.lines; track $index) {
    <div [ngStyle]="line"></div>
  }
}
