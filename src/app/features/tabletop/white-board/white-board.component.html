<ng-template #faceLook>
  <div
    class="pointer-events-auto absolute inset-0 backface-visible"
    [style.opacity]="opacity()"
    [style.background-color]="color()"
  ></div>

  @if (imageUrl().length > 0) {
    <!-- Whatever is drawn on the board is not the board: it hangs at its own weight over a
         face that may be faded to nothing, so a plan can float in the air over the table. -->
    <div
      class="pointer-events-none absolute inset-0 bg-contain bg-center bg-no-repeat backface-visible"
      [style.background-image]="'url(' + imageUrl() + ')' | safe: 'style'"
    ></div>
  }
</ng-template>
<ng-template #livePictureLayer>
  @for (picture of livePictures(); track picture.id) {
    <img
      class="pointer-events-none absolute backface-visible"
      [src]="picture.url | safe: 'resourceUrl'"
      [style.left.px]="picture.left"
      [style.top.px]="picture.top"
      [style.width.px]="picture.width"
      [style.height.px]="picture.height"
      [style.transform]="picture.transform"
      [style.opacity]="picture.opacity"
      alt=""
    />
  }
</ng-template>
<!--
  The board is a box on the screen round where the table's canvas draws it, and its face is laid on
  it in perspective, clear as the canvas draws a picture of it, with what hangs on the face; the
  table lays the pieces on the board over it, and its handles stand at the corners of its foot.
-->
@let id = whiteBoard().identifier;
<div
  class="group pointer-events-none size-full select-none"
  [class.cursor-grab]="!isLock()"
  data-hud-box
  appMovable
  [movable.option]="movableOption()"
  [movable.disable]="isLock()"
  [appSelectable]="whiteBoard()"
  (movable.ondragstart)="onMove()"
  (movable.ondragend)="onMoved()"
>
  <div
    class="pointer-events-none size-full"
    appRotable
    [rotable.option]="rotableOption()"
    [rotable.disable]="isLock()"
    (rotable.ondragstart)="onMove()"
    (rotable.valueChange)="onRotated($event)"
    (rotable.ondragend)="onMoved()"
  >
    <div
      class="pointer-events-auto"
      [attr.data-surface]="id"
      [appTooltip]="whiteBoard()"
      [style.width.px]="widthPx()"
      [style.height.px]="heightPx()"
      [appHudPlace]="{ owner: id, part: 'face', place: 'face' }"
    >
      <div class="absolute inset-0 opacity-0" #face data-part="face">
        <ng-container [ngTemplateOutlet]="faceLook"></ng-container>
      </div>
      <ng-container [ngTemplateOutlet]="livePictureLayer"></ng-container>
    </div>
    @if (!isLock()) {
      <turn-frame [owner]="id" [stand]="turnStand()" [cornersAlwaysSeen]="true" />
    }
  </div>
</div>
