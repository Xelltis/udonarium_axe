<!--
  The light is a box on the screen round where the table's canvas draws its mark, and a cone's
  handle stands off the point it turns about. Its mark is drawn here, out of sight, for the canvas
  to draw a picture of.
-->
@let id = lightSource().identifier;
<div
  class="group pointer-events-none size-full select-none"
  [class.cursor-grab]="!isLock()"
  data-hud-box
  appMovable
  [movable.option]="movableOption()"
  [movable.disable]="isLock()"
  [appSelectable]="lightSource()"
  (movable.ondragstart)="onMove()"
  (movable.ondragend)="onMoved()"
>
  <div
    data-part="mark"
    class="pointer-events-auto"
    [appTooltip]="lightSource()"
    [appHudPlace]="{ owner: id, part: 'mark' }"
  ></div>
  <div
    class="pointer-events-none size-0"
    appRotable
    [rotable.option]="rotableOption()"
    [rotable.disable]="isLock()"
    (rotable.ondragstart)="onMove()"
    (rotable.valueChange)="onRotated($event)"
    (rotable.ondragend)="onMoved()"
  >
    @if (!isLock() && isCone()) {
      <div
        class="rotate-grab border-ui-border-panel bg-ui-elevated text-ui-muted pointer-events-auto box-border flex size-7 cursor-default items-center justify-center rounded-full border-2 border-solid p-0 opacity-0 group-hover:opacity-90 [&_.material-icons]:text-[18px]!"
        [appHudPlace]="{ owner: id, at: grabPoint() }"
      >
        <i class="material-icons">autorenew</i>
      </div>
    }
  </div>
</div>
<div class="pointer-events-none fixed top-0 left-0 opacity-0">
  @if (skinUrl().length > 0) {
    <img
      class="object-contain object-center"
      #mark
      [class.opacity-40]="!enabled()"
      [style.width.px]="gridSize"
      [style.height.px]="gridSize"
      [src]="skinUrl() | safe: 'resourceUrl'"
      alt=""
    />
  } @else {
    <div
      class="flex size-9 items-center justify-center rounded-full border border-white/40 bg-black/40"
      #mark
      [class.opacity-40]="!enabled()"
    >
      <i class="material-icons text-[22px]" [style.color]="iconColor()">lightbulb</i>
    </div>
  }
</div>
