@if (model(); as model) {
  <ul hidden data-testid="interrupt-overlay">
    @for (lit of model.lit; track $index) {
      <li data-testid="interrupt-lit" [attr.data-points]="lit.text"></li>
    }
    @if (model.point; as point) {
      <li data-testid="interrupt-point" [attr.data-x]="point.x" [attr.data-y]="point.y"></li>
    }
  </ul>
}
