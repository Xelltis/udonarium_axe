<!--
  The range is a box on the screen round where the table's canvas draws its cells, with its handle
  and its lock on the point it turns about. Its cells are drawn here, out of sight, for the canvas
  to draw a picture of.
-->
@let id = range().identifier;
<div
  class="group pointer-events-none size-full select-none [-moz-user-drag:none] [-webkit-user-drag:none]"
  [class.cursor-grab]="!isLock()"
  data-hud-box
  appMovable
  [movable.option]="movableOption()"
  [movable.disable]="isLock()"
  [appSelectable]="range()"
  (movable.ondragstart)="onMove()"
  (movable.ondragend)="onMoved()"
>
  <div
    data-part="picture"
    class="pointer-events-auto"
    [appTooltip]="range()"
    [appHudPlace]="{ owner: id, part: 'picture' }"
  ></div>
  <div
    class="pointer-events-none size-0"
    appRotable
    [rotable.option]="rotableOption()"
    (rotable.ondragstart)="onMove()"
    (rotable.valueChange)="onRotateChanged($event)"
    (rotable.ondragend)="onMoved()"
    [rotable.disable]="isLock() || !isRotatableRangeType()"
  >
    @if (isLock()) {
      <div
        class="bg-ui-elevated text-ui-muted flex size-6.25 items-center justify-center rounded-full"
        [appHudPlace]="{ owner: id, at: turnPoint() }"
      >
        <i class="material-icons">lock</i>
      </div>
    }
    @if (!isLock() && isRotatableRangeType()) {
      <div
        class="rotate-grab border-ui-border-panel bg-ui-elevated text-ui-muted pointer-events-auto box-border flex size-10.5 cursor-default items-center justify-center rounded-full border-2 border-solid p-0 text-[24px] opacity-0 group-hover:opacity-86 group-active:opacity-86 [&_.material-icons]:text-[28px]!"
        [class.range-rotate-grab--single]="usesSingleRotateGrab()"
        [appHudPlace]="{ owner: id, at: grabPoint() }"
      >
        <i class="material-icons">autorenew</i>
      </div>
    }
  </div>
  @if (altitudeGuide(); as guide) {
    <altitude-guide [owner]="id" [guide]="guide" [colour]="range().rangeColor" />
  }
</div>
<div class="pointer-events-none fixed top-0 left-0 opacity-0">
  <div class="absolute" #cells [style.width.px]="0" [style.height.px]="0" [style.clip-path]="clipPath()">
    <div class="absolute" [style.top.px]="0" [style.left.px]="-1 * areaQuadrantSize() * squarePx">
      <canvas class="absolute inset-0 m-auto block" [style.opacity]="opacity()" #gridCanvas></canvas>
      <canvas class="absolute inset-0 m-auto block" #rangeCanvas></canvas>
    </div>
  </div>
</div>
