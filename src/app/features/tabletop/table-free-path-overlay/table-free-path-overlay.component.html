@if (model().own || model().others.length > 0) {
  <ul hidden data-testid="free-path-overlay">
    @for (way of model().others; track $index) {
      <li data-testid="free-path-other" [attr.data-points]="way"></li>
    }
    @if (model().own; as own) {
      @if (own.reach; as reach) {
        <li
          data-testid="free-path-reach"
          [attr.data-x]="reach.cx"
          [attr.data-y]="reach.cy"
          [attr.data-reach]="reach.r"
        ></li>
      }
      <li data-testid="free-path-settled" [attr.data-points]="own.settled"></li>
      @if (own.ahead) {
        <li data-testid="free-path-ahead" [attr.data-points]="own.ahead"></li>
      }
    }
  </ul>
}
