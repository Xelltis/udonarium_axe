@if (visible()) {
  <div
    #banner
    class="border-ui-border-panel bg-ui-panel rounded-ui-lg shadow-ui-md text-ui-text fixed top-0 left-0 z-200 flex max-w-[92vw] cursor-grab items-center gap-3 border border-solid px-4 py-2.5 [backdrop-filter:blur(24px)_saturate(1.5)] select-none [-webkit-backdrop-filter:blur(24px)_saturate(1.5)] active:cursor-grabbing"
    appDraggable
    [draggable.disable]="isCompact()"
    [draggable.unhandle]="'button'"
    [appWidgetPlace]="widgetName"
    [widgetFallback]="fallback"
    [widgetPlaceEnabled]="!isCompact()"
    [ngClass]="
      isCompact()
        ? 'inset-x-2! top-[max(0.75rem,env(safe-area-inset-top))]! z-210 max-w-none! cursor-default flex-col items-stretch gap-2 p-3'
        : ''
    "
  >
    <div class="flex min-w-0 items-center gap-3">
      <i class="material-icons text-ui-accent text-[20px]">history</i>
      <div class="flex min-w-0 flex-col">
        <span class="text-[0.82rem]" [ngClass]="isCompact() ? 'leading-snug' : 'truncate'">{{
          'feature.roomArchive.banner.message' | transloco
        }}</span>
        <span class="text-ui-muted truncate text-[0.72rem]">{{ savedAtLabel() }}</span>
      </div>
    </div>
    <div class="flex items-center gap-3" [ngClass]="isCompact() ? 'gap-2' : 'contents'">
      <button
        class="rounded-ui-sm border-ui-accent bg-ui-accent-solid hover:border-ui-accent-hover hover:bg-ui-accent-hover cursor-pointer border border-solid px-[1.1em] py-[0.4em] text-[0.8rem] whitespace-nowrap text-white hover:shadow-[0_0_0_3px_var(--ui-accent-glow)]"
        [ngClass]="isCompact() ? 'min-h-10 flex-1 py-2.5 text-[0.85rem]' : ''"
        [disabled]="isRestoring()"
        (click)="restore()"
      >
        {{ 'feature.roomArchive.banner.restore' | transloco }}
      </button>
      <button
        class="rounded-ui-sm border-ui-border-panel cursor-pointer px-[0.9em] py-[0.4em] text-[0.8rem] whitespace-nowrap"
        [ngClass]="isCompact() ? 'min-h-10 flex-1 border border-solid py-2.5 text-[0.85rem]' : ''"
        [disabled]="isRestoring()"
        (click)="dismiss()"
      >
        {{ 'feature.roomArchive.banner.dismiss' | transloco }}
      </button>
    </div>
  </div>
}
