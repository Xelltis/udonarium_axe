@if (area(); as areaShape) {
  <div [ngStyle]="areaStyle(areaShape)"></div>
}
@if (prospect(); as prospected) {
  <div data-testid="effect-area-prospect" [ngStyle]="prospectAreaStyle(prospected)"></div>
  @for (mark of prospected.marks; track mark.identifier) {
    <div data-testid="effect-prospect-mark" [ngStyle]="prospectMarkStyle(mark)"></div>
  }
}
@if (caster(); as casterMark) {
  <div data-testid="effect-caster-mark" [ngStyle]="casterStyle(casterMark)"></div>
}
@for (link of links(); track link.identifier) {
  <div [ngStyle]="linkStyle(link)"></div>
}
@for (mark of marks(); track mark.identifier) {
  <div data-testid="effect-target-mark" [ngStyle]="markStyle(mark)"></div>
  @if (badges()) {
    <div [ngStyle]="badgeStyle(mark)">{{ mark.order }}</div>
  }
}
