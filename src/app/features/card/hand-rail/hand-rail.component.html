@if (canHoldCards() && rail.isOpen()) {
  <div
    #rail
    class="hand-rail animate-fly-in rounded-ui-lg border-ui-border-panel bg-ui-panel text-ui-text fixed top-0 left-0 z-140 box-border flex cursor-grab flex-col overflow-visible border border-solid p-0 shadow-[var(--ui-shadow-md),inset_0_1px_0_rgba(255,255,255,0.06)] [backdrop-filter:blur(24px)_saturate(1.5)] select-none [-webkit-backdrop-filter:blur(24px)_saturate(1.5)] active:cursor-grabbing"
    [class.max-w-screen]="isCompact()"
    [class.ring-2]="drag.tableCard()"
    [class.ring-ui-accent]="drag.tableCard()"
    appDraggable
    [draggable.unhandle]="'button,.hand-card'"
  >
    <div
      class="rounded-t-ui-lg border-ui-border-titlebar bg-ui-titlebar text-ui-titlebar-muted relative box-border h-7 w-full border-b border-solid px-2 text-xs/7 font-medium tracking-[0.02em] select-none"
    >
      <div class="absolute top-0 right-0 flex h-7 items-center gap-0.5 px-1.5">
        <button
          class="rounded-ui-sm text-ui-dim hover:bg-ui-hover hover:text-ui-text m-0 inline-flex h-5.5 transform-none items-center justify-center border-none bg-transparent px-1 py-0.5 leading-none shadow-none transition-colors outline-none hover:border-transparent hover:shadow-none"
          [title]="'feature.card.hand.drawFromOther' | transloco"
          [attr.aria-label]="'feature.card.hand.drawFromOther' | transloco"
          (click)="openDrawPanel()"
        >
          <i class="material-icons text-[14px]!">back_hand</i>
        </button>
        <button
          class="rounded-ui-sm text-ui-dim hover:bg-ui-hover hover:text-ui-text m-0 inline-flex h-5.5 transform-none items-center justify-center border-none bg-transparent px-1 py-0.5 leading-none shadow-none transition-colors outline-none hover:border-transparent hover:shadow-none disabled:cursor-default disabled:opacity-40"
          [title]="(pairCount() > 0 ? 'feature.card.hand.discardPairs' : 'feature.card.hand.noPairs') | transloco"
          [attr.aria-label]="'feature.card.hand.discardPairs' | transloco"
          [disabled]="pairCount() < 1"
          (click)="discardPairs()"
        >
          <i class="material-icons text-[14px]!">filter_2</i>
        </button>
        <button
          class="rounded-ui-sm text-ui-dim hover:bg-ui-hover hover:text-ui-text m-0 inline-flex h-5.5 transform-none items-center justify-center border-none bg-transparent px-1 py-0.5 leading-none shadow-none transition-colors outline-none hover:border-transparent hover:shadow-none"
          [title]="'feature.gmTools.npcBar.close' | transloco"
          (click)="close()"
        >
          <i class="material-icons text-[14px]!">close</i>
        </button>
      </div>
      <div class="block truncate pr-8">
        {{ 'feature.card.hand.title' | transloco: { count: cards().length } }}
      </div>
    </div>

    <div class="rounded-b-ui-lg box-content px-3 py-2">
      @if (cards().length) {
        <div #fan class="relative" [style.width.px]="fanWidthPx()" [style.height.px]="fanHeightPx">
          @for (card of cards(); track card.identifier) {
            <div
              class="hand-card absolute top-0 left-0 origin-bottom cursor-grab touch-none transition-transform duration-150 ease-out active:cursor-grabbing"
              [style.width.px]="cardWidthPx"
              [style.height.px]="cardHeightPx"
              [style.transform]="cardTransform(card)"
              [style.zIndex]="cardZIndex(card)"
              [class.opacity-40]="isDragging(card)"
              (pointerenter)="setHovered(card)"
              (pointerleave)="setHovered(null)"
              (pointerdown)="onCardPointerDown($event, card)"
              (pointermove)="onCardPointerMove($event)"
              (pointerup)="onCardPointerUp($event)"
              (pointercancel)="onCardPointerCancel($event)"
            >
              <div
                class="border-ui-border-panel bg-ui-elevated shadow-ui-sm relative size-full overflow-hidden rounded-sm border border-solid"
                [title]="displayName(card)"
              >
                <card-face-preview
                  [card]="card"
                  [imageUrl]="imageUrl(card)"
                  [frameWidth]="cardWidthPx"
                  [frameHeight]="cardHeightPx"
                />
              </div>

              @if (hovered() === card.identifier) {
                <div
                  class="bg-ui-panel/90 absolute inset-x-0 bottom-0 z-3 flex justify-center gap-0.5 rounded-b-sm py-0.5"
                  [ngClass]="isTouch() ? 'shadow-ui-sm top-[calc(100%+2px)]! bottom-auto! rounded-sm! py-1' : ''"
                >
                  <button
                    class="rounded-ui-sm text-ui-dim hover:bg-ui-hover hover:text-ui-text m-0 inline-flex h-5 transform-none cursor-pointer items-center justify-center border-none bg-transparent px-1 leading-none shadow-none transition-colors outline-none hover:border-transparent hover:shadow-none"
                    [ngClass]="isTouch() ? 'h-8! px-3!' : ''"
                    [title]="'feature.card.hand.playFaceUp' | transloco"
                    (click)="playFaceUp(card)"
                  >
                    <i class="material-icons text-[13px]!" [ngClass]="isTouch() ? 'text-[18px]!' : ''">visibility</i>
                  </button>

                  <button
                    class="rounded-ui-sm text-ui-dim hover:bg-ui-hover hover:text-ui-text m-0 inline-flex h-5 transform-none cursor-pointer items-center justify-center border-none bg-transparent px-1 leading-none shadow-none transition-colors outline-none hover:border-transparent hover:shadow-none"
                    [ngClass]="isTouch() ? 'h-8! px-3!' : ''"
                    [title]="'feature.card.hand.playFaceDown' | transloco"
                    (click)="playFaceDown(card)"
                  >
                    <i class="material-icons text-[13px]!" [ngClass]="isTouch() ? 'text-[18px]!' : ''"
                      >visibility_off</i
                    >
                  </button>
                </div>
              }
            </div>
          }
        </div>
      } @else {
        <p
          class="text-ui-dim m-0 flex items-center justify-center text-[12px] whitespace-nowrap"
          [style.width.px]="fanWidthPx()"
          [style.height.px]="fanHeightPx"
        >
          {{ 'feature.card.hand.empty' | transloco }}
        </p>
      }
    </div>
  </div>
}
