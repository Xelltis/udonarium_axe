@let shown = badge();
<span
  data-testid="buff-badge"
  class="relative inline-flex"
  [attr.title]="shown.name + (shown.effect ? ' / ' + shown.effect : '')"
>
  <span
    data-testid="buff-badge-mark"
    class="relative inline-flex size-[1.5em] items-center justify-center rounded-full border border-solid border-white/35 text-[0.95em] leading-none shadow-[0_0.1em_0.25em_rgba(0,0,0,0.6)]"
    [style.background]="shown.color"
  >
    @if (shown.iconUrl) {
      <img class="pointer-events-none size-[0.9em] object-contain" [src]="shown.iconUrl | safe: 'resourceUrl'" alt="" />
    } @else {
      {{ shown.icon }}
    }
    @if (shown.strength) {
      <span
        class="bg-ui-accent-solid pointer-events-none absolute top-[-0.35em] left-[-0.4em] rounded-[0.3em] px-[0.18em] text-[0.45em] leading-tight font-bold text-white shadow-[0_0.1em_0.2em_rgba(0,0,0,0.7)]"
        >{{ shown.strength }}</span
      >
    }
  </span>
  @if (shown.expires) {
    <span
      data-testid="buff-rounds"
      class="pointer-events-none absolute right-[-0.35em] bottom-[-0.3em] rounded-[0.25em] border border-solid border-white/30 bg-black/90 px-[0.2em] text-[0.52em] leading-tight font-bold text-white tabular-nums"
      >{{ shown.rounds }}</span
    >
  }
</span>
