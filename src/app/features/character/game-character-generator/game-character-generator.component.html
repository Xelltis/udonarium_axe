<div class="text-ui-text flex h-full flex-col gap-3 p-3 text-[13px]">
  <section class="border-ui-border-panel bg-ui-elevated rounded-ui flex flex-col gap-2.5 border border-solid p-3">
    <h2 class="text-ui-accent m-0 flex items-center gap-1.5 text-[11px] font-bold tracking-[0.08em] uppercase">
      <i class="material-icons text-[15px]!">person_add</i>
      {{ 'feature.character.generator.createCharacter' | transloco }}
    </h2>

    <div class="flex items-start gap-3">
      <button
        class="border-ui-border-panel bg-ui-input hover:border-ui-accent rounded-ui-sm relative flex size-20 shrink-0 cursor-pointer items-center justify-center overflow-hidden border border-solid p-0"
        type="button"
        [title]="'feature.character.generator.pickImage' | transloco"
        (click)="openModal()"
      >
        @if (tableBackgroundImage().url) {
          <img
            class="size-full object-cover object-[50%_0%]"
            [src]="tableBackgroundImage().url | safe: 'resourceUrl'"
            alt=""
          />
        } @else {
          <i class="material-icons text-ui-dim text-[28px]!">add_photo_alternate</i>
        }
      </button>

      <div class="flex min-w-0 flex-1 flex-col gap-2">
        <label class="flex flex-col gap-1">
          <span class="text-ui-muted text-[11px]">{{ 'feature.character.generator.nameLabel' | transloco }}</span>
          <input
            class="border-ui-border-panel bg-ui-input text-ui-text focus:border-ui-accent rounded-ui-sm w-full border border-solid px-2 py-1.5 text-[13px] outline-none"
            name="name"
            [(ngModel)]="name"
          />
        </label>

        <label class="flex flex-col gap-1">
          <span class="text-ui-muted text-[11px]">{{ 'feature.character.generator.sizeLabel' | transloco }}</span>
          <span class="flex items-center gap-2">
            <input
              class="min-w-0 flex-1"
              name="size"
              type="range"
              [min]="minSize"
              [max]="maxSize"
              step="0.5"
              [(ngModel)]="size"
            />
            <input
              class="border-ui-border-panel bg-ui-input text-ui-text focus:border-ui-accent rounded-ui-sm w-16 shrink-0 border border-solid px-2 py-1.5 text-center text-[13px] outline-none"
              name="size-number"
              type="number"
              [min]="minSize"
              [max]="maxSize"
              step="0.5"
              [(ngModel)]="size"
            />
          </span>
        </label>
      </div>
    </div>

    <button
      class="rounded-ui bg-ui-accent-solid flex w-full cursor-pointer items-center justify-center gap-1.5 border-none px-3 py-2.5 text-[13px] font-semibold text-white disabled:opacity-40"
      type="button"
      [disabled]="!canEdit"
      (click)="createGameCharacter()"
    >
      <i class="material-icons text-[17px]!">person_add</i>
      {{ 'feature.character.generator.createCharacter' | transloco }}
    </button>
  </section>

  <section class="border-ui-border-panel bg-ui-elevated rounded-ui flex flex-col gap-2 border border-solid p-3">
    <h2 class="text-ui-accent m-0 flex items-center gap-1.5 text-[11px] font-bold tracking-[0.08em] uppercase">
      <i class="material-icons text-[15px]!">dashboard</i>
      {{ 'feature.character.generator.otherSection' | transloco }}
    </h2>

    <button
      class="border-ui-border-panel bg-ui-input text-ui-text hover:border-ui-accent hover:text-ui-accent rounded-ui flex w-full cursor-pointer items-center gap-2 border border-solid px-3 py-2.5 text-[13px] disabled:opacity-40"
      type="button"
      [disabled]="!canEdit"
      (click)="createGameTableMask()"
    >
      <i class="material-icons text-[17px]!">grid_on</i>
      {{ 'feature.character.generator.createMask' | transloco }}
    </button>

    <button
      class="border-ui-border-panel bg-ui-input text-ui-text hover:border-ui-accent hover:text-ui-accent rounded-ui flex w-full cursor-pointer items-center gap-2 border border-solid px-3 py-2.5 text-[13px]"
      type="button"
      (click)="openImportCharacter()"
    >
      <i class="material-icons text-[17px]!">cloud_download</i>
      {{ 'feature.character.generator.importCharacter' | transloco }}
    </button>
  </section>
</div>
