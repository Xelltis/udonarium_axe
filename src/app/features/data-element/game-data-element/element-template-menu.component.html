@if (open()) {
  <div class="fixed inset-0 z-100" (click)="open.set(false)"></div>
  <div
    class="elm-template-menu bg-ui-elevated border-ui-border-panel absolute top-[calc(100%+4px)] right-0 z-101 max-h-80 w-48 overflow-y-auto rounded-sm border p-1 shadow-[0_4px_16px_rgba(0,0,0,0.4)]"
  >
    @for (template of templates(); track template.identifier) {
      <div class="flex items-center gap-0.5">
        <button
          class="text-ui-text hover:bg-ui-hover min-w-0 flex-1 cursor-pointer truncate rounded-xs border-none bg-transparent px-1.5 py-1 text-left text-[0.85em]"
          type="button"
          (click)="insert.emit(template)"
          [appTextTooltip]="template.name"
        >
          {{ template.name }}
        </button>
        <button
          class="text-ui-muted hover:bg-ui-danger-bg hover:text-ui-danger inline-flex h-5.5 w-5 shrink-0 cursor-pointer items-center justify-center rounded-xs border-none bg-transparent p-0 [&_.material-icons]:text-[14px]"
          type="button"
          (click)="removeTemplate(template, $event)"
          [title]="'feature.dataElement.action.deleteTemplate' | transloco"
        >
          <i class="material-icons">close</i>
        </button>
      </div>
    }
  </div>
}
