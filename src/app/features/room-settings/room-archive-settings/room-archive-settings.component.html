<div class="contents" [attr.inert]="isReadOnly() ? '' : null">
  <div class="border-ui-border-panel bg-ui-surface rounded-ui flex flex-col gap-2.5 border border-solid p-3">
    <label
      class="text-ui-text hover:bg-ui-hover rounded-ui-sm -mx-1.5 flex cursor-pointer items-center gap-2 px-1.5 py-1 text-[13px] transition-colors select-none"
    >
      <input
        type="checkbox"
        class="size-3.5 cursor-pointer [accent-color:var(--ui-accent)]"
        [checked]="isKeeping()"
        (change)="setKeeping($event)"
      />
      <span class="text-[12px]">{{ 'feature.roomSettings.autoSaveKeeping' | transloco }}</span>
    </label>
    <p class="text-ui-muted m-0 text-[11px] leading-relaxed">
      {{ 'feature.roomSettings.autoSaveHint' | transloco }}
    </p>
  </div>

  <div class="border-ui-border-panel bg-ui-surface rounded-ui border border-solid [&>div]:h-auto">
    <app-room-snapshot-panel />
  </div>
</div>
