<div class="text-ui-text flex h-full flex-col gap-2 p-3">
  <div class="flex items-center gap-2">
    @if (isOpen()) {
      <div class="relative">
        <button
          class="rounded-ui-sm flex max-w-72 cursor-pointer items-center gap-1 px-[0.8em] py-[0.3em] text-[0.74rem]"
          [attr.aria-expanded]="isChooserOpen()"
          (click)="toggleChooser()"
        >
          <i class="material-icons text-[15px]">video_library</i>
          <span class="truncate">{{ openedLabel() }}</span>
          <i class="material-icons text-[15px]">expand_more</i>
        </button>
        @if (isChooserOpen()) {
          <div class="fixed inset-0 z-10" (click)="isChooserOpen.set(false)"></div>
          <div
            class="border-ui-border bg-ui-panel rounded-ui shadow-ui-md absolute top-[calc(100%+4px)] left-0 z-11 h-96 w-80 border border-solid p-2"
          >
            <replay-recording-list />
          </div>
        }
      </div>
    }
    @if (isRecording()) {
      <span class="text-ui-muted flex items-center gap-1 text-[0.72rem]">
        <span class="size-1.5 animate-pulse rounded-full bg-red-500"></span>
        {{ 'feature.replay.workspace.recording' | transloco }}
      </span>
    }
    <span class="flex-1"></span>
    @if (isOpen()) {
      <button
        class="rounded-ui-sm flex cursor-pointer items-center gap-1 px-[0.8em] py-[0.3em] text-[0.74rem]"
        [class.text-ui-accent]="isPreviewOpen()"
        [attr.aria-pressed]="isPreviewOpen()"
        [title]="'feature.replay.video.previewHint' | transloco"
        (click)="togglePreview()"
      >
        <i class="material-icons text-[15px]">smart_display</i>
        {{ 'feature.replay.video.preview' | transloco }}
      </button>
      <button
        class="rounded-ui-sm flex cursor-pointer items-center gap-1 px-[0.8em] py-[0.3em] text-[0.74rem]"
        [class.text-ui-accent]="isDigestOpen()"
        [title]="'feature.replay.digest.hint' | transloco"
        (click)="toggleDigest()"
      >
        <i class="material-icons text-[15px]">insights</i>
        {{ 'feature.replay.digest.title' | transloco }}
      </button>
      <replay-script-panel />
      <replay-video-panel />
      @if (!isEditing()) {
        <button
          class="rounded-ui-sm cursor-pointer px-[0.8em] py-[0.3em] text-[0.74rem]"
          [disabled]="!canEdit"
          (click)="beginEditing()"
        >
          {{ 'feature.replay.editor.begin' | transloco }}
        </button>
      } @else {
        <button
          class="rounded-ui-sm border-ui-accent bg-ui-accent hover:border-ui-accent-hover hover:bg-ui-accent-hover cursor-pointer border border-solid px-[0.8em] py-[0.3em] text-[0.74rem] text-white"
          [disabled]="!isDirty() || isSaving()"
          (click)="saveEdits()"
        >
          {{ 'feature.replay.editor.save' | transloco }}
        </button>
        <button
          class="rounded-ui-sm flex cursor-pointer items-center gap-1 px-[0.8em] py-[0.3em] text-[0.74rem]"
          [disabled]="!canUndo()"
          [title]="'feature.replay.editor.undoHint' | transloco"
          (click)="undo()"
        >
          <i class="material-icons text-[15px]">undo</i>
          {{ 'feature.replay.editor.undo' | transloco }}
        </button>
        <button
          class="rounded-ui-sm cursor-pointer px-[0.8em] py-[0.3em] text-[0.74rem]"
          [disabled]="!isDirty()"
          (click)="revertEditing()"
        >
          {{ 'feature.replay.editor.revert' | transloco }}
        </button>
        <button class="rounded-ui-sm cursor-pointer px-[0.8em] py-[0.3em] text-[0.74rem]" (click)="cancelEditing()">
          {{ 'feature.replay.editor.cancel' | transloco }}
        </button>
      }
    }
  </div>

  @if (isOpen()) {
    <div class="flex min-h-0 flex-1 gap-3">
      <div class="flex w-[42%] max-w-140 min-w-64 shrink-0 flex-col gap-2">
        @if (isDigestOpen()) {
          <replay-digest-panel />
        } @else if (isPreviewOpen()) {
          <replay-video-preview />
        } @else {
          <replay-stage />
        }
      </div>
      <replay-entry-list class="min-w-0 flex-1" [editing]="isEditing()" />
    </div>
  } @else {
    <replay-recording-list class="min-h-0 flex-1" />
  }
</div>
