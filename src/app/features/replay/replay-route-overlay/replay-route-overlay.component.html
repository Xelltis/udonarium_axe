@if (segments().length > 0) {
  <ul hidden data-testid="replay-route">
    @for (segment of segments(); track segment.index) {
      <li
        data-testid="replay-route-run"
        [attr.data-x]="segment.x"
        [attr.data-y]="segment.y"
        [attr.data-length]="segment.length"
        [attr.data-travelled]="segment.isTravelled ? '' : null"
      ></li>
    }
  </ul>
}
