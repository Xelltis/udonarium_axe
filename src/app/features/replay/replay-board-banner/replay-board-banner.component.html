@if (isBoardMode()) {
  <div class="pointer-events-none fixed inset-0 z-9998 border-4 border-solid border-amber-500/60"></div>
}
@if (isShown()) {
  <div
    class="border-ui-border-panel bg-ui-panel text-ui-text rounded-ui shadow-ui-sm fixed top-3 left-1/2 z-10000 flex max-w-[min(92vw,32rem)] -translate-x-1/2 items-center gap-2 border border-solid px-3 py-2 [backdrop-filter:blur(24px)_saturate(1.5)] [-webkit-backdrop-filter:blur(24px)_saturate(1.5)]"
  >
    <i class="material-icons text-ui-warning shrink-0 text-[18px]">cast</i>
    <div class="flex min-w-0 flex-1 flex-col">
      <span class="text-[0.8rem]">{{ 'feature.replay.board.title' | transloco }}</span>
      <span class="text-ui-muted text-[0.7rem] leading-normal">{{ 'feature.replay.board.hint' | transloco }}</span>
    </div>
    <button class="rounded-ui-sm cursor-pointer px-[0.8em] py-[0.3em] text-[0.74rem]" (click)="exit()">
      {{ 'feature.replay.player.boardStop' | transloco }}
    </button>
  </div>
}
