@if (barService.isOpen()) {
  <div
    class="npc-bar-dropzone npc-bar-dropdown rounded-ui-lg border-ui-border-panel bg-ui-panel text-ui-text shadow-ui-md absolute top-[calc(100%+6px)] left-0 z-10 flex max-w-[90vw] cursor-default flex-col gap-1 border border-solid px-2 py-1.5 [backdrop-filter:blur(24px)_saturate(1.5)] [-webkit-backdrop-filter:blur(24px)_saturate(1.5)]"
    [class.ring-2]="drag.character()"
    [class.ring-ui-accent]="drag.character()"
  >
    @if (npcs().length > 0) {
      <div class="flex items-center gap-1.5">
        <i class="material-icons text-ui-muted text-[16px]!">search</i>
        <input
          class="bg-ui-input border-ui-border-panel text-ui-text rounded-ui-sm focus:border-ui-accent box-border min-w-0 flex-1 border border-solid px-1.5 py-0.5 text-[11px] transition-[border-color] outline-none"
          name="npc-search"
          [(ngModel)]="search"
          [placeholder]="'feature.gmTools.npcBar.searchPlaceholder' | transloco"
        />
        <span class="text-ui-dim shrink-0 text-[10px] whitespace-nowrap"
          >{{ filteredNpcs().length }} / {{ npcs().length }}</span
        >
      </div>
    }
    <div class="flex items-center gap-1 overflow-x-auto">
      @for (npc of filteredNpcs(); track npc.identifier) {
        <div class="group relative flex shrink-0">
          <button
            type="button"
            class="rounded-ui-sm border-ui-border-panel hover:border-ui-accent hover:bg-ui-accent-bg flex w-14 cursor-pointer flex-col items-center gap-0.5 border border-solid bg-transparent p-0.5 transition-colors"
            [attr.title]="npc.name"
            (click)="select(npc)"
            (contextmenu)="unregister(npc); $event.preventDefault()"
          >
            @if (imageUrl(npc)) {
              <img class="size-9 rounded-sm object-contain" [src]="imageUrl(npc) | safe: 'resourceUrl'" alt="" />
            } @else {
              <i class="material-icons text-ui-muted flex size-9 items-center justify-center text-[20px]!">person</i>
            }
            <span class="text-ui-text w-full truncate text-center text-[10px]/tight">{{ npc.name }}</span>
          </button>
          <button
            type="button"
            class="bg-ui-elevated border-ui-border-panel text-ui-muted hover:text-ui-accent absolute -top-1 -right-1 hidden size-4 cursor-pointer items-center justify-center rounded-full border border-solid p-0 group-hover:flex [&_.material-icons]:text-[11px]!"
            [attr.title]="'feature.gmTools.npcBar.unregister' | transloco"
            (click)="unregister(npc)"
          >
            <i class="material-icons">close</i>
          </button>
        </div>
      } @empty {
        <span class="text-ui-dim p-2 text-[11px] whitespace-nowrap">{{
          (npcs().length > 0 ? 'feature.gmTools.npcBar.noMatch' : 'feature.gmTools.npcBar.empty') | transloco
        }}</span>
      }
    </div>
  </div>
}
