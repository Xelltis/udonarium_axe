<div
  class="border-ui-border-panel bg-ui-panel text-ui-text shadow-ui-md rounded-ui-lg flex w-max items-center gap-1 border border-solid p-1.5 [backdrop-filter:blur(24px)_saturate(1.5)] [-webkit-backdrop-filter:blur(24px)_saturate(1.5)]"
  role="dialog"
  data-testid="seat-display"
  [attr.aria-label]="'feature.seatDisplay.title' | transloco"
>
  <div class="flex gap-0.5">
    <ui-icon-button
      [icon]="viewIcon()"
      [label]="viewLabelKey() | transloco"
      testId="seat-view"
      (press)="cycleViewMode()"
    />
    <ui-icon-button
      [icon]="themeIcons[theme.theme()]"
      [label]="'common.theme.' + theme.theme() | transloco"
      testId="seat-theme"
      (press)="theme.cycle()"
    />
    <ui-icon-button
      [icon]="motionIcons[motion.setting()]"
      [label]="'common.motion.' + motion.setting() | transloco"
      testId="seat-motion"
      (press)="motion.cycle()"
    />
    <ui-icon-button
      [icon]="renderLiteIcons[renderLite.setting()]"
      [label]="'common.renderLite.' + renderLite.setting() | transloco"
      testId="seat-render-lite"
      (press)="renderLite.cycle()"
    />
    <button
      type="button"
      class="rounded-ui-sm text-ui-text hover:bg-ui-menu-hover hover:text-ui-accent flex size-8 cursor-pointer items-center justify-center border-none bg-transparent text-[11px] font-semibold tracking-wide transition-colors"
      [attr.aria-label]="'common.language.switchTooltip' | transloco"
      [title]="'common.language.switchTooltip' | transloco"
      data-testid="seat-lang"
      (click)="cycleLanguage()"
    >
      {{ language.currentLang().toUpperCase() }}
    </button>
    @if (viewport.isCompact() && mobile.prefersDesktop()) {
      <ui-icon-button
        icon="smartphone"
        [label]="'feature.mobile.useMobile' | transloco"
        testId="seat-use-mobile"
        (press)="mobile.useMobileLayout()"
      />
    }
  </div>

  <div
    class="border-ui-border-panel flex gap-0.5 border-l border-solid pl-1"
    role="group"
    [attr.aria-label]="'feature.seatDisplay.widgets.label' | transloco"
  >
    @for (widget of widgetSwitches(); track widget.key) {
      <ui-icon-button
        [icon]="widget.icon"
        [label]="widget.labelKey | transloco"
        [active]="widget.shown()"
        [pressed]="widget.shown()"
        [testId]="'seat-widget-' + widget.key"
        (press)="widget.toggle()"
      />
    }
  </div>
</div>
