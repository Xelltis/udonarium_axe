<p class="text-ui-dim m-0 text-xs">{{ 'feature.file.imageIntake.hint' | transloco }}</p>

<div
  class="rounded-ui-sm border-ui-border-panel flex min-h-40 flex-1 items-center justify-center overflow-hidden border border-solid bg-[repeating-conic-gradient(#d4d4d4_0_25%,#f4f4f4_0_50%)] bg-size-[16px_16px]"
>
  <canvas
    #canvas
    data-testid="image-intake-canvas"
    class="block max-h-full max-w-full cursor-crosshair object-contain"
    [class.hidden]="state() === 'loading' || state() === 'failed'"
    (click)="pick($event)"
  ></canvas>
  @if (state() === 'loading') {
    <i class="material-icons text-ui-dim animate-spin">sync</i>
  } @else if (state() === 'failed') {
    <p class="text-ui-dim m-0 p-3 text-center text-xs">{{ 'feature.file.imageIntake.failed' | transloco }}</p>
  }
</div>

<label class="text-ui-muted flex items-center gap-2 text-xs">
  <span class="shrink-0">{{ 'feature.file.imageIntake.tolerance' | transloco }}</span>
  <input
    type="range"
    min="0"
    max="128"
    class="min-w-0 flex-1 [accent-color:var(--ui-accent)]"
    data-testid="image-intake-tolerance"
    [value]="tolerance()"
    [disabled]="state() !== 'ready'"
    (input)="setTolerance($any($event.target).valueAsNumber)"
  />
  <span class="w-7 shrink-0 text-right tabular-nums">{{ tolerance() }}</span>
</label>

@if (state() === 'tooLarge') {
  <p class="m-0 text-xs text-amber-400" data-testid="image-intake-too-large">
    {{ 'feature.file.imageIntake.tooLarge' | transloco }}
  </p>
}

<div class="flex items-center gap-1.5">
  <button
    type="button"
    class="bg-ui-elevated border-ui-border-panel text-ui-muted rounded-ui-sm hover:bg-ui-hover hover:text-ui-text inline-flex cursor-pointer items-center gap-1 border border-solid px-2.5 py-1 text-xs transition-[background,color] disabled:cursor-default disabled:opacity-40 [&_.material-icons]:text-[14px]!"
    data-testid="image-intake-undo"
    [disabled]="points().length === 0"
    (click)="undo()"
  >
    <i class="material-icons">undo</i>{{ 'feature.file.imageIntake.undo' | transloco }}
  </button>
  <span class="flex-1"></span>
  <button
    type="button"
    class="bg-ui-elevated border-ui-border-panel text-ui-muted rounded-ui-sm hover:bg-ui-hover hover:text-ui-text cursor-pointer border border-solid px-3 py-1 text-xs transition-[background,color]"
    (click)="cancel()"
  >
    {{ 'feature.file.imageIntake.cancel' | transloco }}
  </button>
  <button
    type="button"
    class="rounded-ui-sm bg-ui-accent inline-flex cursor-pointer items-center gap-1 border-none px-3 py-1 text-xs font-medium text-white transition-opacity hover:opacity-85 disabled:cursor-default disabled:opacity-40 [&_.material-icons]:text-[14px]!"
    data-testid="image-intake-add"
    [disabled]="state() !== 'ready' && state() !== 'tooLarge'"
    (click)="add()"
  >
    <i class="material-icons">add_photo_alternate</i>{{ 'feature.file.imageIntake.add' | transloco }}
  </button>
</div>
