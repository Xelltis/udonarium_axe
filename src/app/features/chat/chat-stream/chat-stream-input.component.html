<div class="border-ui-border-panel flex flex-col gap-1.5 border-t border-solid p-1.5">
  <div class="flex min-w-0 items-center gap-1.5">
    <div
      class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-dim flex size-6 flex-none items-center justify-center overflow-hidden border border-solid"
      aria-hidden="true"
    >
      @if (speaker()?.image; as image) {
        <img class="size-full object-cover object-[50%_0%]" [src]="image | safe: 'resourceUrl'" alt="" />
      } @else {
        <i class="material-icons text-[15px]!">person</i>
      }
    </div>
    <select
      data-testid="chat-stream-speaker"
      class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text focus:border-ui-accent h-6 min-w-0 flex-1 cursor-pointer border border-solid px-1 text-[12px] outline-none"
      [attr.aria-label]="'feature.chat.stream.speaker' | transloco"
      [ngModel]="speaker()?.identifier"
      (ngModelChange)="sendFrom.set($event)"
    >
      @for (each of speakers(); track each.identifier) {
        <option [ngValue]="each.identifier">{{ each.name }}</option>
      }
    </select>
  </div>
  <div class="flex min-w-0 items-end gap-1.5">
    <textarea
      uiComposingMark
      data-testid="chat-stream-text"
      rows="1"
      class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text placeholder:text-ui-dim focus:border-ui-accent box-border block field-sizing-content max-h-24 min-h-8 min-w-0 flex-1 resize-none border border-solid px-2 py-1.5 text-[13px] leading-snug outline-none disabled:opacity-50"
      [attr.aria-label]="'feature.chat.stream.text' | transloco"
      [placeholder]="(canSpeak() ? 'feature.chat.stream.placeholder' : 'feature.chat.input.viewOnly') | transloco"
      [disabled]="!canSpeak()"
      [ngModel]="text()"
      (ngModelChange)="text.set($event)"
      (keydown)="onKeydown($event)"
    ></textarea>
    <button
      type="button"
      data-testid="chat-stream-send"
      class="rounded-ui-sm bg-ui-accent-solid flex size-8 flex-none cursor-pointer items-center justify-center border-none p-0 text-white transition-opacity disabled:cursor-default disabled:opacity-40"
      [title]="'feature.chat.input.send' | transloco"
      [attr.aria-label]="'feature.chat.input.send' | transloco"
      [disabled]="!sendable()"
      (click)="send()"
    >
      <i class="material-icons text-[17px]!">send</i>
    </button>
  </div>
</div>
