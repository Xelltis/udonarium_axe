<!-- The coin is a box on the screen round where the canvas draws it. -->
<div
  class="pointer-events-auto size-full cursor-grab select-none [-moz-user-drag:none] [-webkit-user-drag:none]"
  data-hud-box
  appMovable
  [movable.option]="movableOption()"
  [movable.disable]="isLock"
  [appSelectable]="coin()"
  (movable.ondragstart)="onMove()"
  (movable.ondragend)="onMoved()"
>
  <div data-part="coin" [appHudPlace]="{ owner: coin().identifier, part: 'coin' }"></div>
</div>
