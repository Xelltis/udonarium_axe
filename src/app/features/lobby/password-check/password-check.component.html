<form name="password-check" #passwordForm="ngForm" (ngSubmit)="submit()">
  <div class="mb-2.5 flex items-center gap-2.5">
    <label
      class="text-ui-muted text-[0.78rem] font-semibold tracking-[0.04em] whitespace-nowrap uppercase"
      for="pw-input"
    >
      {{ 'feature.lobby.passwordCheck.passwordLabel' | transloco }}
    </label>
    <input
      id="pw-input"
      class="box-border flex-1 px-2.5 py-1.5 text-[0.9rem]"
      name="password"
      [ngModel]="password()"
      (ngModelChange)="onPasswordChange($event)"
      [ngModelOptions]="{ standalone: true }"
      [placeholder]="'feature.lobby.passwordCheck.passwordPlaceholder' | transloco"
      #passwordInput
    />
    <button
      class="rounded-ui-sm border-ui-accent bg-ui-accent-solid hover:border-ui-accent-hover hover:bg-ui-accent-hover border border-solid px-[1.2em] py-[0.45em] text-[0.875rem] whitespace-nowrap text-white hover:shadow-[0_0_0_3px_var(--ui-accent-glow)]"
      type="submit"
    >
      <i class="material-icons" style="font-size: 14px; vertical-align: middle; margin-right: 3px">login</i
      >{{ 'feature.lobby.passwordCheck.submit' | transloco }}
    </button>
  </div>
</form>
<p class="text-ui-danger min-h-[1.2em] text-[0.8rem]">{{ help() }}</p>
