@if (!isMine()) {
  <div
    #cursor
    class="pointer-events-none absolute overflow-visible will-change-transform select-none [-moz-user-drag:none] [-webkit-transform-style:preserve-3d] [-webkit-user-drag:none] [transition:transform_133ms_linear,opacity_0.5s_ease-out] transform-3d"
  >
    <div
      #opacity
      class="absolute inset-x-0 bottom-0 [-webkit-transform-style:preserve-3d] [transition:transform_133ms_linear,opacity_0.5s_ease-out] transform-3d"
    >
      @for (cssClass of ['is-front', 'is-back']; track cssClass) {
        <div
          class="animate-cursor-ping border-ui-accent bg-ui-panel absolute top-0 left-0 box-border size-11.25 origin-bottom-right rounded-[50%_50%_5%_50%] border-2 border-solid shadow-[0_0_0_0_var(--ui-accent-glow),0_2px_10px_rgba(0,0,0,0.45)] backface-hidden"
          [ngClass]="
            cssClass === 'is-front'
              ? 'transform-[translateX(-100%)_translateY(-100%)_rotateX(-90deg)_rotateZ(45deg)]'
              : 'transform-[translateX(-100%)_translateY(-100%)_rotateX(-90deg)_rotateY(180deg)_rotateZ(45deg)]'
          "
        >
          <div
            class="size-full transform-[rotateZ(-45deg)_scale(0.85)] overflow-visible rounded-full bg-cover bg-position-[top,center] bg-no-repeat"
            [style.background-image]="'url(' + iconUrl() + ')' | safe: 'style'"
          >
            <div
              class="bg-ui-accent absolute -top-6.5 left-1/2 box-border -translate-x-1/2 rounded-[14px] px-1.5 py-0.5 text-[9px] font-bold whitespace-nowrap text-white"
            >
              <span class="whitespace-nowrap">{{ name() }}</span>
              @if (showRoleBadge()) {
                <span class="ml-1 rounded-sm px-1 text-[8px] font-bold" [class]="roleBadgeClass()">{{
                  roleBadgeText()
                }}</span>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
}
