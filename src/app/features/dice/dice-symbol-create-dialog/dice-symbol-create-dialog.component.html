<form class="box-border flex w-64 max-w-full flex-col gap-3 p-2" (ngSubmit)="confirm()">
  <label class="text-ui-muted grid grid-cols-[4em_minmax(0,1fr)] items-center gap-2 text-[12px]">
    <span>{{ 'feature.dice.createDialog.type' | transloco }}</span>
    <select
      class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text box-border w-full min-w-0 border border-solid px-2 py-1.25 text-[13px]"
      name="dice-type"
      [(ngModel)]="typeIndex"
    >
      @for (item of diceItems; track item.menuName; let index = $index) {
        <option [ngValue]="index">{{ item.menuName }}</option>
      }
    </select>
  </label>

  <label class="text-ui-muted grid grid-cols-[4em_minmax(0,1fr)] items-center gap-2 text-[12px]">
    <span>{{ 'feature.dice.createDialog.count' | transloco }}</span>
    <input
      class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text box-border w-full min-w-0 border border-solid px-2 py-1.25 text-[13px]"
      name="dice-count"
      type="number"
      min="1"
      [max]="maxCount"
      step="1"
      [(ngModel)]="count"
      autofocus
    />
  </label>

  @if (ownerCandidates.length > 0) {
    <label class="text-ui-muted grid grid-cols-[4em_minmax(0,1fr)] items-center gap-2 text-[12px]">
      <span>{{ 'feature.dice.createDialog.owner' | transloco }}</span>
      <select
        class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text box-border w-full min-w-0 border border-solid px-2 py-1.25 text-[13px]"
        name="dice-owner"
        [(ngModel)]="ownerCharacterIdentifier"
      >
        <option [ngValue]="''">{{ 'feature.dice.createDialog.ownerNone' | transloco }}</option>
        @for (candidate of ownerCandidates; track candidate.identifier) {
          <option [ngValue]="candidate.identifier">{{ candidate.name }}</option>
        }
      </select>
    </label>
  }

  <label class="text-ui-muted flex cursor-pointer items-center gap-1.5 text-[12px] [accent-color:var(--ui-accent)]">
    <input name="dice-hidden" type="checkbox" [(ngModel)]="hiddenToOthers" />
    {{ 'feature.dice.createDialog.hidden' | transloco }}
  </label>

  <div class="flex justify-end gap-2">
    <button class="px-2.5 py-1.25 text-[12px]" type="button" (click)="cancel()">
      {{ 'feature.dice.createDialog.cancel' | transloco }}
    </button>
    <button class="border-ui-accent bg-ui-accent px-2.5 py-1.25 text-[12px] text-white" type="submit">
      {{ 'feature.dice.createDialog.create' | transloco }}
    </button>
  </div>
</form>
