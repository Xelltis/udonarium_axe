<button
  type="button"
  class="rounded-ui-sm text-ui-text hover:bg-ui-menu-hover hover:text-ui-accent after:bg-ui-panel after:border-ui-border-panel after:text-ui-text after:rounded-ui after:shadow-ui-sm relative flex size-8 cursor-pointer items-center justify-center border-none bg-transparent transition-colors after:pointer-events-none after:absolute after:top-1/2 after:left-[calc(100%+10px)] after:z-10000 after:-translate-y-1/2 after:border after:border-solid after:px-2.5 after:py-1 after:text-[11px] after:whitespace-nowrap after:opacity-0 after:[backdrop-filter:blur(24px)_saturate(1.5)] after:transition-opacity after:content-[attr(data-label)] after:[-webkit-backdrop-filter:blur(24px)_saturate(1.5)] hover:after:opacity-100 focus-visible:after:opacity-100 disabled:cursor-default disabled:opacity-45 [&_i]:text-[20px]!"
  [class.text-ui-accent]="lit()"
  [class.bg-ui-accent-bg]="lit()"
  [disabled]="disabled()"
  [attr.aria-pressed]="lit()"
  [attr.aria-label]="label()"
  [attr.data-label]="label()"
  [attr.data-testid]="testId()"
  (click)="press.emit($event)"
>
  @if (text()) {
    <span class="text-[11px] font-semibold tracking-wide">{{ text() }}</span>
  } @else {
    <i class="material-icons" aria-hidden="true">{{ icon() }}</i>
  }
</button>
