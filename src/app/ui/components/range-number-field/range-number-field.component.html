<input
  type="range"
  class="flex-1 [accent-color:var(--ui-accent)] disabled:cursor-not-allowed disabled:opacity-50"
  [ngModel]="value()"
  (ngModelChange)="value.set($event)"
  [min]="min()"
  [max]="max()"
  [attr.name]="rangeName()"
  [disabled]="disabled()"
/>
<input
  type="number"
  class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text focus:border-ui-accent w-[4.5em] border border-solid px-1.5 py-1 text-right text-[13px] transition-colors outline-none disabled:cursor-not-allowed disabled:opacity-50"
  [ngModel]="value()"
  (ngModelChange)="value.set($event)"
  [min]="min()"
  [max]="max()"
  [attr.name]="numberName()"
  [disabled]="disabled()"
/>
