@let label = name() ?? ('ui.portraitPicker.unnamed' | transloco: { index: selectedIndex() + 1 });
<input
  type="range"
  class="accent-ui-accent m-0 h-4 min-w-16 flex-1 cursor-pointer"
  min="0"
  [max]="last()"
  step="1"
  [value]="selectedIndex()"
  [attr.aria-label]="'ui.portraitPicker.title' | transloco"
  [attr.aria-valuetext]="label"
  (input)="slid($event)"
  (wheel)="wheel($event)"
/>
<span class="text-ui-muted flex max-w-28 min-w-0 shrink-0 items-baseline gap-1 text-[11px] leading-none">
  @if (name(); as shown) {
    <span class="truncate" [title]="shown">{{ shown }}</span>
  }
  <span class="shrink-0 tabular-nums">{{ selectedIndex() + 1 }}/{{ choices().length }}</span>
</span>
