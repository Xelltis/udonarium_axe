<div
  #track
  class="relative flex min-w-0 flex-1 scrollbar-none items-center gap-1 overflow-x-auto overflow-y-hidden py-px"
  role="listbox"
  aria-orientation="horizontal"
  tabindex="0"
  [attr.aria-label]="'ui.portraitPicker.title' | transloco"
  (wheel)="slide($event)"
  (keydown)="step($event)"
>
  @for (choice of choices(); track choice.index) {
    @let name =
      choice.name.length > 0 ? choice.name : ('ui.portraitPicker.unnamed' | transloco: { index: choice.index + 1 });
    @let chosen = choice.index === selectedIndex();
    <button
      type="button"
      tabindex="-1"
      class="rounded-ui-sm border-ui-border-panel bg-ui-input hover:border-ui-accent m-0 flex size-6 shrink-0 cursor-pointer items-center justify-center overflow-hidden border border-solid p-0 transition-[border-color,box-shadow]"
      [class.border-ui-accent]="chosen"
      [class.shadow-[0_0_0_1px_var(--ui-accent)]]="chosen"
      role="option"
      [attr.aria-selected]="chosen"
      [attr.data-index]="choice.index"
      [title]="name"
      (click)="pick(choice.index)"
    >
      @if (choice.url.length > 0) {
        <img
          class="pointer-events-none size-full object-cover object-top"
          [src]="choice.url | safe: 'resourceUrl'"
          alt=""
          draggable="false"
        />
      } @else {
        <i class="material-icons text-ui-dim text-[16px]!">person</i>
      }
    </button>
  }
</div>
