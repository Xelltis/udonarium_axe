@for (part of parts(); track $index) {
  @if (part.stamp) {
    <ui-stamp class="align-middle" [stampId]="part.stamp" [size]="stampSize()" />
  } @else if (part.reading.length > 0) {
    <ruby
      class="chat-ruby"
      [class]="classesOf(part)"
      [style.color]="part.decoration?.color"
      [style.text-shadow]="haloOf(part)"
      ><rb>{{ part.text }}</rb
      ><rt>{{ part.reading }}</rt></ruby
    >
  } @else {
    <span [class]="classesOf(part)" [style.color]="part.decoration?.color" [style.text-shadow]="haloOf(part)">{{
      part.text
    }}</span>
  }
}
