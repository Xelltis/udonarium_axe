<!--
  The frame lies on the face round the thing's foot, laid there in perspective: everything in it is
  placed in its own pixels, from its top left as the thing lies unturned, and turns with the thing.
-->
@if (shown()) {
  <div
    class="pointer-events-none"
    data-testid="turn-frame"
    [class.opacity-0]="carried()"
    [appHudPlace]="{ owner: owner(), lay: lay() }"
  >
    <svg
      class="pointer-events-none absolute inset-0 size-full overflow-visible"
      aria-hidden="true"
      [attr.viewBox]="'0 0 ' + frame().width + ' ' + frame().depth"
    >
      <path
        class="rotate-grab [pointer-events:stroke] cursor-grab active:cursor-grabbing"
        data-testid="turn-frame-line"
        fill="none"
        stroke="transparent"
        stroke-width="16"
        [attr.d]="linePath()"
      />
      <path
        fill="none"
        stroke="rgba(0,0,0,0.55)"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
        [attr.d]="linePath()"
      />
      <path
        fill="none"
        stroke="rgba(255,255,255,0.92)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        [attr.d]="linePath()"
      />
      @if (frontMark(); as mark) {
        <path
          class="fill-ui-accent-solid"
          data-testid="turn-frame-front"
          stroke="rgba(255,255,255,0.92)"
          stroke-width="1.5"
          stroke-linejoin="round"
          [attr.d]="mark"
        />
      }
    </svg>
    @for (knob of knobs(); track $index) {
      @if (knob.seen) {
        <div
          class="rotate-grab border-ui-accent bg-ui-elevated text-ui-text absolute flex -translate-1/2 cursor-grab items-center justify-center rounded-full border-2 border-solid shadow-[0_1px_4px_rgba(0,0,0,0.6)] active:cursor-grabbing"
          data-testid="turn-frame-knob"
          [style.left.px]="knob.x"
          [style.top.px]="knob.y"
          [style.width.px]="knobPx"
          [style.height.px]="knobPx"
          [attr.aria-label]="'feature.tabletop.turnFrame.name' | transloco"
          [appTextTooltip]="'feature.tabletop.turnFrame.hint' | transloco: { step: snapStep() }"
        >
          <svg
            class="pointer-events-none"
            viewBox="0 0 24 24"
            aria-hidden="true"
            [style.width.px]="knobIconPx"
            [style.height.px]="knobIconPx"
          >
            <path
              d="M4 13.5c0 2.5 3.6 4.5 8 4.5s8-2 8-4.5-3.6-4.5-8-4.5c-1.6 0-3.1.3-4.3.7"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="M9.6 6.2 6.9 9.5l4.1.9"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      }
    }
  </div>
  @if (angle() !== null) {
    <div class="pointer-events-none whitespace-nowrap" [appHudPlace]="{ owner: owner(), at: readoutAt() }">
      <div
        class="bg-ui-panel text-ui-text shadow-ui-sm rounded-full px-2 py-0.5 text-xs/snug font-medium tabular-nums"
        data-testid="turn-frame-readout"
      >
        {{ angle() }}°
      </div>
    </div>
  }
}
